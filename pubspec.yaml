name: mobile
description: "LeLviv mobile app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.2
  google_fonts: ^9.0.0
  http: ^1.6.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Neucha
      fonts:
        - asset: assets/fonts/Neucha-Regular.ttf

    - family: LibreFranklin
      fonts:
        - asset: assets/fonts/LibreFranklin-Black.ttf
          weight: 900